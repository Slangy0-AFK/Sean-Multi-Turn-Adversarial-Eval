name: Offline smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mock-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run unit tests
        run: python3 oit.py --selftest
      - name: Run mock backend smoke test
        run: python3 oit.py --mock --trials 10 --seed 1 --out "$RUNNER_TEMP/oit-mock-smoke.json"
